", "type": "match", "q": "Hypoalbuminemia", "opts": ["Low oncotic pressure may cause edema", "Dehydration may raise measured concentration", "Increased total protein concentration", "Low albumin and/or increased globulins", "Reduced total protein concentration"], "c": [0], "ctx": "Set B: Match each condition (1–5) with a description (A–E).", "n": 132}, {"sec": "a4", "grp": "A", "num": "73", "type": "match", "q": "Decreased A/G ratio", "opts": ["Low oncotic pressure may cause edema", "Dehydration may raise measured concentration", "Increased total protein concentration", "Low albumin and/or increased globulins", "Reduced total protein concentration"], "c": [3], "ctx": "Set B: Match each condition (1–5) with a description (A–E).", "n": 133}, {"sec": "a4", "grp": "A", "num": "74", "type": "match", "q": "Osteoblasts", "opts": ["Produce gamma globulins", "Major site of albumin synthesis", "Bone ALP isoenzyme", "Placental ALP isoenzyme", "Source of most plasma proteins"], "c": [2], "ctx": "Set C: Match the source (1–5) with its product or role (A–E).", "n": 134}, {"sec": "a4", "grp": "A", "num": "75", "type": "match", "q": "Placenta", "opts": ["Produce gamma globulins", "Major site of albumin synthesis", "Bone ALP isoenzyme", "Placental ALP isoenzyme", "Source of most plasma proteins"], "c": [3], "ctx": "Set C: Match the source (1–5) with its product or role (A–E).", "n": 135}, {"sec": "a4", "grp": "A", "num": "76", "type": "match", "q": "Hepatocytes", "opts": ["Produce gamma globulins", "Major site of albumin synthesis", "Bone ALP isoenzyme", "Placental ALP isoenzyme", "Source of most plasma proteins"], "c": [1], "ctx": "Set C: Match the source (1–5) with its product or role (A–E).", "n": 136}, {"sec": "a4", "grp": "A", "num": "77", "type": "match", "q": "Plasma cells", "opts": ["Produce gamma globulins", "Major site of albumin synthesis", "Bone ALP isoenzyme", "Placental ALP isoenzyme", "Source of most plasma proteins"], "c": [0], "ctx": "Set C: Match the source (1–5) with its product or role (A–E).", "n": 137}, {"sec": "a4", "grp": "A", "num": "78", "type": "match", "q": "Liver", "opts": ["Produce gamma globulins", "Major site of albumin synthesis", "Bone ALP isoenzyme", "Placental ALP isoenzyme", "Source of most plasma proteins"], "c": [4], "ctx": "Set C: Match the source (1–5) with its product or role (A–E).", "n": 138}, {"sec": "a5", "grp": "A", "num": "79", "type": "prob", "q": "Define GGT and state two functions.", "ans": "Gamma-glutamyl transferase; membrane-bound enzyme involved in extracellular glutathione metabolism and amino-acid transport.", "ctx": "", "n": 139}, {"sec": "a5", "grp": "A", "num": "80", "type": "prob", "q": "List four causes of increased GGT.", "ans": "Hepatitis, cholestasis/obstruction, cirrhosis, hepatocellular carcinoma, alcohol intake, pancreatitis, hyperthyroidism, diabetes with hypertension (any four).", "ctx": "", "n": 140}, {"sec": "a5", "grp": "A", "num": "81", "type": "prob", "q": "Explain how GGT helps interpret an increased ALP result.", "ans": "Raised ALP plus raised GGT supports a hepatobiliary source; raised ALP with normal GGT may suggest bone or another non-hepatic source.", "ctx": "", "n": 141}, {"sec": "a5", "grp": "A", "num": "82", "type": "prob", "q": "State the sample type and tube recommended for GGT testing.", "ans": "Plain tube and serum; do not use EDTA.", "ctx": "", "n": 142}, {"sec": "a5", "grp": "A", "num": "83", "type": "prob", "q": "Define ALP and describe its main biochemical reaction.", "ans": "Membrane-bound enzyme that hydrolyzes phosphate esters at alkaline pH, removing phosphate groups.", "ctx": "", "n": 143}, {"sec": "a5", "grp": "A", "num": "84", "type": "prob", "q": "List four normal tissue sources of ALP.", "ans": "Liver, bone, kidney, intestine and placenta (any four).", "ctx": "", "n": 144}, {"sec": "a5", "grp": "A", "num": "85", "type": "prob", "q": "Why may ALP be increased in children and during pregnancy?", "ans": "Children have active bone growth; placenta contributes ALP during pregnancy, especially later pregnancy.", "ctx": "", "n": 145}, {"sec": "a5", "grp": "A", "num": "86", "type": "prob", "q": "Compare intrahepatic and extrahepatic cholestasis in relation to ALP.", "ans": "Intrahepatic cholestasis occurs within liver/bile pathways; extrahepatic cholestasis is outside the liver, often due to duct obstruction. ALP may rise in both.", "ctx": "", "n": 146}, {"sec": "a5", "grp": "A", "num": "87", "type": "prob", "q": "Write the full names and older abbreviations of AST and ALT.", "ans": "AST: aspartate aminotransferase, SGOT. ALT: alanine aminotransferase, SGPT.", "ctx": "", "n": 147}, {"sec": "a5", "grp": "A", "num": "88", "type": "prob", "q": "Write the AST-catalyzed reaction and name its products.", "ans": "Aspartate + alpha-ketoglutarate ⇌ oxaloacetate + glutamate.", "ctx": "", "n": 148}, {"sec": "a5", "grp": "A", "num": "89", "type": "prob", "q": "Write the ALT-catalyzed reaction and name its products.", "ans": "Alanine + alpha-ketoglutarate ⇌ pyruvate + glutamate.", "ctx": "", "n": 149}, {"sec": "a5", "grp": "A", "num": "90", "type": "prob", "q": "Give three reasons AST is less liver-specific than ALT.", "ans": "AST is present in heart, skeletal muscle and RBCs; it can rise with muscle injury or hemolysis.", "ctx": "", "n": 150}, {"sec": "a5", "grp": "A", "num": "91", "type": "prob", "q": "Define the De Ritis ratio and give two interpretations of an increased ratio.", "ans": "AST/ALT. A ratio >1 can occur in advanced cirrhosis or cardiac/muscle injury; >2 may suggest alcohol-associated liver disease in suitable context.", "ctx": "", "n": 151}, {"sec": "a5", "grp": "A", "num": "92", "type": "prob", "q": "List the main liver-related tests.", "ans": "ALT, AST, ALP, GGT, bilirubin, albumin and clotting tests.", "ctx": "", "n": 152}, {"sec": "a5", "grp": "A", "num": "93", "type": "prob", "q": "Differentiate liver excretory function from synthetic function and give one test for each.", "ans": "Excretory: bilirubin. Synthetic: albumin or clotting factors.", "ctx": "", "n": 153}, {"sec": "a5", "grp": "A", "num": "94", "type": "prob", "q": "Define total protein and name its major components.", "ans": "Total protein is the combined concentration of major proteins, mainly albumin and globulins.", "ctx": "", "n": 154}, {"sec": "a5", "grp": "A", "num": "95", "type": "prob", "q": "Differentiate plasma from serum in relation to fibrinogen.", "ans": "Plasma contains fibrinogen; serum is obtained after clotting and lacks most fibrinogen.", "ctx": "", "n": 155}, {"sec": "a5", "grp": "A", "num": "96", "type": "prob", "q": "Name the main site of synthesis of albumin, fibrinogen, most alpha globulins and most beta globulins.", "ans": "The liver produces albumin, fibrinogen, most alpha globulins and most beta globulins.", "ctx": "", "n": 156}, {"sec": "a5", "grp": "A", "num": "97", "type": "prob", "q": "Where are gamma globulins produced?", "ans": "Plasma cells in lymphoid tissues, spleen and bone marrow.", "ctx": "", "n": 157}, {"sec": "a5", "grp": "A", "num": "98", "type": "prob", "q": "List four functions of plasma proteins.", "ans": "Transport, oncotic pressure, immune defense, clotting/fibrinolysis.", "ctx": "", "n": 158}, {"sec": "a5", "grp": "A", "num": "99", "type": "prob", "q": "Explain why serum total protein may be lower than plasma total protein.", "ans": "Fibrinogen is present in plasma but removed during clotting, making serum protein slightly lower.", "ctx": "", "n": 159}, {"sec": "a5", "grp": "A", "num": "100", "type": "prob", "q": "Describe two pre-analytical factors that can affect serum protein measurement.", "ans": "Prolonged tourniquet causes hemoconcentration; IV infusion near sampling may dilute results; plasma/serum differs due to fibrinogen.", "ctx": "", "n": 160}, {"sec": "a5", "grp": "A", "num": "101", "type": "prob", "q": "Define hyperproteinemia and list three causes.", "ans": "Increase in circulating protein concentration; causes include dehydration, chronic infections, multiple myeloma and some lymphomas.", "ctx": "", "n": 161}, {"sec": "a5", "grp": "A", "num": "102", "type": "prob", "q": "Define hypoproteinemia and list five causes.", "ans": "Starvation, malnutrition/malabsorption, liver failure, renal protein loss, protein-losing enteropathy, bleeding, burns, inflammation or catabolic states.", "ctx": "", "n": 162}, {"sec": "a5", "grp": "A", "num": "103", "type": "prob", "q": "Describe albumin processing from preproalbumin to mature albumin.", "ans": "Preproalbumin loses its signal peptide to form proalbumin; furin removes a hexapeptide to form mature albumin.", "ctx": "", "n": 163}, {"sec": "a5", "grp": "A", "num": "104", "type": "prob", "q": "List four functions of albumin.", "ans": "Maintains oncotic pressure; transports bilirubin; transports fatty acids/sterols; binds and solubilizes drugs.", "ctx": "", "n": 164}, {"sec": "a5", "grp": "A", "num": "105", "type": "prob", "q": "Explain how hypoalbuminemia can cause edema.", "ans": "Low albumin lowers plasma oncotic pressure, allowing fluid to move from vessels into tissues, causing edema.", "ctx": "", "n": 165}, {"sec": "a5", "grp": "A", "num": "106", "type": "prob", "q": "Why is true hyperalbuminemia due to increased synthesis uncommon?", "ans": "Dehydration concentrates albumin because plasma water is reduced; it does not usually reflect increased synthesis.", "ctx": "", "n": 166}, {"sec": "a5", "grp": "A", "num": "107", "type": "prob", "q": "Explain the relationship between low albumin and the A/G ratio.", "ans": "Low albumin reduces the numerator; increased globulins increase the denominator, so the A/G ratio falls.", "ctx": "", "n": 167}, {"sec": "a6", "grp": "A", "num": "108", "type": "prob", "q": "A patient has increased ALP and GGT. Which source of ALP is more likely, and why?", "ans": "Hepatobiliary source is more likely because GGT also rises with liver/bile duct disease; interpret with other findings.", "ctx": "", "n": 168}, {"sec": "a6", "grp": "A", "num": "109", "type": "prob", "q": "A child has increased ALP but normal GGT and no other evidence of liver disease. Give a likely explanation.", "ans": "Physiological increase due to active bone growth and bone ALP.", "ctx": "", "n": 169}, {"sec": "a6", "grp": "A", "num": "110", "type": "prob", "q": "A patient with suspected bile duct obstruction has markedly increased ALP and GGT. What pattern does this suggest?", "ans": "A cholestatic/obstructive enzyme pattern consistent with hepatobiliary obstruction.", "ctx": "", "n": 170}, {"sec": "a6", "grp": "A", "num": "111", "type": "prob", "q": "A patient reports heavy alcohol intake and has elevated GGT. Give one possible interpretation and one limitation of GGT.", "ans": "Alcohol can increase GGT, but GGT is nonspecific and rises in several conditions.", "ctx": "", "n": 171}, {"sec": "a6", "grp": "A", "num": "112", "type": "prob", "q": "A blood sample for AST is visibly hemolyzed. How may this affect interpretation?", "ans": "AST may be falsely elevated because red cells contain AST; follow lab policy for recollection.", "ctx": "", "n": 172}, {"sec": "a6", "grp": "A", "num": "113", "type": "prob", "q": "A patient has increased AST and ALT. Why can these results not identify the exact cause by themselves?", "ans": "AST/ALT indicate tissue injury but are not virus-specific and can rise in nonhepatic conditions.", "ctx": "", "n": 173}, {"sec": "a6", "grp": "A", "num": "114", "type": "prob", "q": "A patient has AST 160 U/L and ALT 60 U/L. Calculate the De Ritis ratio and state one possible association.", "ans": "160/60 = 2.67; a ratio above 2 may suggest alcohol-associated liver disease, but is not diagnostic alone.", "ctx": "", "n": 174}, {"sec": "a6", "grp": "A", "num": "115", "type": "prob", "q": "A patient has AST 120 U/L and ALT 240 U/L. Calculate the AST/ALT ratio and describe the pattern.", "ans": "120/240 = 0.5; ALT predominance may occur in acute viral hepatitis or fatty liver disease.", "ctx": "", "n": 175}, {"sec": "a6", "grp": "A", "num": "116", "type": "prob", "q": "A patient with liver disease has low albumin and prolonged clotting time. Which liver function may be impaired?", "ans": "Reduced hepatic synthetic function may be present; interpret with other tests and context.", "ctx": "", "n": 176}, {"sec": "a6", "grp": "A", "num": "117", "type": "prob", "q": "A patient has elevated direct bilirubin. Which broad liver function is being assessed?", "ans": "Excretory function.", "ctx": "", "n": 177}, {"sec": "a6", "grp": "A", "num": "118", "type": "prob", "q": "A serum total protein result is unexpectedly high after prolonged tourniquet use. What may explain it?", "ans": "Hemoconcentration due to prolonged tourniquet application.", "ctx": "", "n": 178}, {"sec": "a6", "grp": "A", "num": "119", "type": "prob", "q": "A sample is collected from the arm receiving IV fluid. What error may occur in albumin measurement?", "ans": "Dilutional hypoalbuminemia / falsely low measured protein concentration.", "ctx": "", "n": 179}, {"sec": "a6", "grp": "A", "num": "120", "type": "prob", "q": "A dehydrated patient has increased total protein and albumin. Does this prove increased protein synthesis? Explain.", "ans": "No. Dehydration concentrates proteins by reducing plasma water; it does not prove increased synthesis.", "ctx": "", "n": 180}, {"sec": "a6", "grp": "A", "num": "121", "type": "prob", "q": "A patient with multiple myeloma has increased total protein. Which protein fraction may be responsible?", "ans": "Immunoglobulins, sometimes a monoclonal immunoglobulin, may increase total protein.", "ctx": "", "n": 181}, {"sec": "a6", "grp": "A", "num": "122", "type": "prob", "q": "A patient with nephrotic syndrome has low albumin. Explain the mechanism.", "ans": "Protein is lost in urine, reducing serum albumin.", "ctx": "", "n": 182}, {"sec": "a6", "grp": "A", "num": "123", "type": "prob", "q": "A patient with severe burns develops hypoalbuminemia. Give a possible mechanism.", "ans": "Protein loss through damaged skin and increased catabolism can lower albumin.", "ctx": "", "n": 183}, {"sec": "a6", "grp": "A", "num": "124", "type": "prob", "q": "A malnourished patient has low albumin. Explain the relationship to protein availability.", "ans": "Inadequate protein/amino acid availability can reduce albumin synthesis.", "ctx": "", "n": 184}, {"sec": "a6", "grp": "A", "num": "125", "type": "prob", "q": "A patient with chronic cirrhosis has low albumin. What is the likely mechanism?", "ans": "Reduced synthesis by diseased hepatocytes.", "ctx": "", "n": 185}, {"sec": "a6", "grp": "A", "num": "126", "type": "prob", "q": "A patient has generalized edema and low albumin. Explain the change in oncotic pressure and fluid movement.", "ans": "Reduced oncotic pressure shifts fluid from vessels into tissues, causing edema.", "ctx": "", "n": 186}, {"sec": "a6", "grp": "A", "num": "127", "type": "prob", "q": "A patient has low albumin and increased globulins. What happens to the A/G ratio?", "ans": "The A/G ratio decreases.", "ctx": "", "n": 187}, {"sec": "a6", "grp": "A", "num": "128", "type": "prob", "q": "A pregnant patient in the third trimester has a moderate ALP increase. Give a possible physiological source.", "ans": "Placental ALP production.", "ctx": "", "n": 188}, {"sec": "a6", "grp": "A", "num": "129", "type": "prob", "q": "A patient recovering from a fracture has a temporary ALP increase. Which source may explain it?", "ans": "Bone-derived ALP from osteoblast activity during fracture healing.", "ctx": "", "n": 189}, {"sec": "a6", "grp": "A", "num": "130", "type": "prob", "q": "A patient has increased AST after strenuous exercise with normal or mildly increased ALT. Give a possible non-hepatic source.", "ans": "Skeletal muscle or cardiac muscle contribution; consider history and further tests.", "ctx": "", "n": 190}, {"sec": "a6", "grp": "A", "num": "131", "type": "prob", "q": "Why should GGT and ALP results be interpreted with clinical history and other tests?", "ans": "These enzymes are not fully specific; clinical history, bilirubin, aminotransferases and other investigations help interpret them.", "ctx": "", "n": 191}, {"sec": "a6", "grp": "A", "num": "132", "type": "prob", "q": "A trainee proposes using an EDTA tube for serum GGT. Correct the recommendation.", "ans": "Use a plain tube to obtain serum; do not use EDTA for this protocol.", "ctx": "", "n": 192}, {"sec": "a7", "grp": "A", "num": "133", "type": "fill", "q": "The enzyme associated with glutathione metabolism and biliary disease.", "disp": "GGT", "blanks": [["ggt", "gamma-glutamyl transferase", "gamma glutamyl transferase"]], "unordered": false, "n": 193}, {"sec": "a7", "grp": "A", "num": "134", "type": "fill", "q": "The enzyme used to help distinguish liver-derived ALP from bone-derived ALP.", "disp": "GGT", "blanks": [["ggt", "gamma-glutamyl transferase", "gamma glutamyl transferase"]], "unordered": false, "n": 194}, {"sec": "a7", "grp": "A", "num": "135", "type": "fill", "q": "The older name SGOT refers to which enzyme?", "disp": "AST", "blanks": [["ast", "aspartate aminotransferase"]], "unordered": false, "n": 195}, {"sec": "a7", "grp": "A", "num": "136", "type": "fill", "q": "The older name SGPT refers to which enzyme?", "disp": "ALT", "blanks": [["alt", "alanine aminotransferase"]], "unordered": false, "n": 196}, {"sec": "a7", "grp": "A", "num": "137", "type": "fill", "q": "The ratio calculated as AST divided by ALT.", "disp": "De Ritis ratio", "blanks": [["de ritis ratio", "de ritis", "ast/alt", "ast/alt ratio"]], "unordered": false, "n": 197}, {"sec": "a7", "grp": "A", "num": "138", "type": "fill", "q": "The enzyme produced by osteoblasts measured as the bone isoenzyme.", "disp": "ALP", "blanks": [["alp", "alkaline phosphatase"]], "unordered": false, "n": 198}, {"sec": "a7", "grp": "A", "num": "139", "type": "fill", "q": "The main protein maintaining plasma oncotic pressure.", "disp": "Albumin", "blanks": [["albumin"]], "unordered": false, "n": 199}, { ation with glucuronic acid by UDP-glucuronyl transferase → bile → intestine → urobilinogen; most becomes stercobilin/urobilin and a small amount is excreted in urine.", "ctx": "", "n": 311}, {"sec": "b5", "grp": "B", "num": "25", "type": "prob", "q": "State three indications for measuring bilirubin.", "ans": "Investigation of jaundice; assessment of liver disease; detection of bile duct obstruction; assessment of newborn jaundice (any three).", "ctx": "", "n": 312}, {"sec": "b5", "grp": "B", "num": "26", "type": "prob", "q": "Differentiate between unconjugated and conjugated bilirubin (solubility, albumin binding, and urine).", "ans": "Unconjugated: not water-soluble, bound to albumin, not excreted in urine. Conjugated: watersoluble, processed by liver, can appear in urine when elevated.", "ctx": "", "n": 313}, {"sec": "b5", "grp": "B", "num": "27", "type": "prob", "q": "Name the three main types of jaundice and state the site of the defect in each.", "ans": "Pre-hepatic: before liver, often excess RBC breakdown. Hepatic: liver-cell damage or impaired uptake/processing. Post-hepatic: blocked bile ducts after liver.", "ctx": "", "n": 314}, {"sec": "b5", "grp": "B", "num": "28", "type": "prob", "q": "Give two causes of pre-hepatic jaundice.", "ans": "Hemolytic disorders such as sickle cell anemia or G6PD deficiency; malaria; transfusion reactions (any two).", "ctx": "", "n": 315}, {"sec": "b5", "grp": "B", "num": "29", "type": "prob", "q": "List two features of post-hepatic obstructive jaundice.", "ans": "Dark urine, pale stools, bilirubin in urine, absent urine urobilinogen.", "ctx": "", "n": 316}, {"sec": "b5", "grp": "B", "num": "30", "type": "prob", "q": "Briefly compare Gilbert’s syndrome and Crigler–Najjar syndrome.", "ans": "Gilbert: mild inherited condition with mild unconjugated bilirubin rise. Crigler–Najjar: severe deficiency/weakness of UDPGT causing high unconjugated bilirubin; type I is severe and type II milder.", "ctx": "", "n": 317}, {"sec": "b5", "gr : past/chronic infection. Anti-HBs: immunity after vaccination or recovery.", "ctx": "", "n": 324}, {"sec": "b5", "grp": "B", "num": "38", "type": "prob", "q": "Differentiate Anti-HCV from HCV RNA by PCR.", "ans": "Anti-HCV is a screening antibody showing exposure; HCV RNA PCR detects viral genetic material and indicates active infection when positive.", "ctx": "", "n": 325}, {"sec": "b5", "grp": "B", "num": "39", "type": "prob", "q": "Why must HBV be present for HDV infection?", "ans": "HDV uses HBsAg from HBV as its envelope and cannot be active alone.", "ctx": "", "n": 326}, {"sec": "b5", "grp": "B", "num": "40", "type": "prob", "q": "List the tests for diagnosing HEV.", "ans": "Anti-HEV IgM/IgG and HEV RNA by PCR; ALT/AST may also increase.", "ctx": "", "n": 327}, {"sec": "b5", "grp": "B", "num": "41", "type": "prob", "q": "Define AFP and list three clinical uses or interpretations", "ans": "Alpha-fetoprotein; helps detect HCC, monitor treatment, and check for recurrence. Falling levels may suggest treatment is working; rising levels may suggest progression/recurrence.", "ctx": "", "n": 328}, {"sec": "b5", "grp": "B", "num": "42", "type": "prob", "q": "Explain why ALT and AST are measured in patients with suspected viral hepatitis.", "ans": "ALT and AST are liver enzymes that may rise in acute viral hepatitis and can remain elevated in chronic infection; they help assess liver-cell injury but do not alone identify the virus.", "ctx": "", "n": 329}, {"sec": "b6", "grp": "B", "num": "43", "type": "prob", "q": "A patient has increased unconjugated bilirubin after marked red blood cell destruction. What type of jaundice is most likely, and what is the mechanism?", "ans": "Pre-hepatic/hemolytic jaundice; excessive RBC breakdown produces more unconjugated bilirubin than the liver can process.", "ctx": "", "n": 330}, {"sec": "b6", "grp": "B", "num": "44", "type": "prob", "q": "A patient has dark urine, pale stools, increased direct bilirubin, and suspected gallstones. ient has positive HCV RNA by PCR. What does this indicate?", "ans": "Active HCV infection / viral RNA is present in blood.", "ctx": "", "n": 339}, {"sec": "b6", "grp": "B", "num": "53", "type": "prob", "q": "A patient is being evaluated for HDV. Which HBV marker must be positive, and why?", "ans": "HBsAg; HDV uses HBV surface antigen as its envelope.", "ctx": "", "n": 340}, {"sec": "b6", "grp": "B", "num": "54", "type": "prob", "q": "A pregnant patient develops acute hepatitis after exposure to contaminated water. Which hepatitis virus should be considered?", "ans": "HEV.", "ctx": "", "n": 341}, {"sec": "b6", "grp": "B", "num": "55", "type": "prob", "q": "A patient being monitored for hepatocellular carcinoma has a falling AFP level. What may this trend indicate?", "ans": "Treatment may be working.", "ctx": "", "n": 342}, {"sec": "b6", "grp": "B", "num": "56", "type": "prob", "q": "A patient has bile duct obstruction and itching. Explain why systemic bile acid concentration may rise.", "ans": "Bile duct obstruction causes bile acids to back up into blood; associates high systemic levels with itching.", "ctx": "", "n": 343}, {"sec": "b6", "grp": "B", "num": "57", "type": "prob", "q": "A urine dipstick shows absent urobilinogen in a patient with pale stools and dark urine. Which type of jaundice is suggested?", "ans": "Post-hepatic/obstructive jaundice.", "ctx": "", "n": 344}, {"sec": "b7", "grp": "B", "num": "58", "type": "fill", "q": "The enzyme that releases iron during conversion of heme to biliverdin.", "disp": "Heme oxygenase", "blanks": [["heme oxygenase"]], "unordered": false, "n": 345}, {"sec": "b7", "grp": "B", "num": "59", "type": "fill", "q": "The protein that acts as a carrier for unconjugated bilirubin in blood.", "disp": "Albumin", "blanks": [["albumin"]], "unordered": false, "n": 346}, {"sec": "b7", "grp": "B", "num": "60", "type": "fill", "q": "The enzyme that conjugates bilirubin with glucuronic acid.", "disp": "UDP-glucuronyl transferase", "blanks": function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nrm(s){s=String(s).toLowerCase().replace(/[–—−]/g,'-').replace(/[^a-z0-9\/]/g,'');return (s.length>3&&s.slice(-1)==='s')?s.slice(0,-1):s}
function okBlank(v,alts){var x=nrm(v);if(!x)return false;for(var i=0;i<alts.length;i++)if(nrm(alts[i])===x)return true;return false}

function correctText(q){
  if(q.type==='mcq')return q.c.map(function(i){return L[i]+') '+q.opts[i]}).join('  +  ');
